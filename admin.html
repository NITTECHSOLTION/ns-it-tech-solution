<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin | N's IT Tech Solution</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#15233b;font:16px/1.5 Arial,sans-serif}.wrap{max-width:1100px;margin:35px auto;padding:20px}.panel{background:#fff;border:1px solid #e0e7f0;border-radius:16px;padding:22px;box-shadow:0 10px 30px #102d5010}h1{margin-top:0}.row{display:flex;gap:10px;flex-wrap:wrap}input,button,select{padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}input{min-width:250px;flex:1}button{cursor:pointer;background:#135dd8;color:white;border:0;font-weight:700}#msg{margin:12px 0;color:#a12b2b}.table-wrap{overflow:auto;margin-top:18px}table{border-collapse:collapse;width:100%;min-width:800px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e7edf5;vertical-align:top}th{background:#f7f9fc}td small{display:block;color:#52627a;max-width:250px;overflow-wrap:anywhere}.muted{color:#52627a;font-size:14px}
</style></head><body><main class="wrap"><section class="panel"><h1>N's IT Tech Solution — Admin</h1><p class="muted">Private ticket dashboard. Keep your administrator token secret and sign out when finished.</p><div class="row"><input id="token" type="password" autocomplete="current-password" placeholder="Administrator token"><button id="load">Load tickets</button><button id="logout" type="button">Clear token</button></div><div id="msg" role="status"></div><div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Customer</th><th>Device / service</th><th>Issue</th><th>Status</th><th>Update</th></tr></thead><tbody id="rows"><tr><td colspan="6">Enter your admin token to load tickets.</td></tr></tbody></table></div></section></main><script>
const $=s=>document.querySelector(s);const allowed=['New Request','Accepted','In Progress','Waiting for Parts','Completed','Cancelled'];$('#load').onclick=load;$('#logout').onclick=()=>{$('#token').value='';sessionStorage.removeItem('nsit-admin-token');$('#rows').innerHTML='<tr><td colspan="6">Token cleared.</td></tr>';$('#msg').textContent='';};$('#token').value=sessionStorage.getItem('nsit-admin-token')||'';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){const token=$('#token').value.trim();if(!token){$('#msg').textContent='Enter your administrator token.';return;}sessionStorage.setItem('nsit-admin-token',token);$('#msg').textContent='Loading…';try{const r=await fetch('/api/admin/tickets',{headers:{Authorization:'Bearer '+token}});const data=await r.json();if(!r.ok)throw Error(data.error||'Could not load tickets');$('#msg').textContent=`${data.length} recent ticket(s).`;$('#rows').innerHTML=data.map(t=>`<tr><td><b>${esc(t.ticketId)}</b><small>${new Date(t.createdAt).toLocaleString()}</small></td><td>${esc(t.name)}<small>${esc(t.phone)}${t.email?' · '+esc(t.email):''}</small></td><td>${esc(t.device)}<small>${esc(t.service)} · ${esc(t.supportType)}</small></td><td>${esc(t.description)}</td><td><select data-ticket="${esc(t.ticketId)}">${allowed.map(s=>`<option ${s===t.status?'selected':''}>${esc(s)}</option>`).join('')}</select></td><td><button data-save="${esc(t.ticketId)}">Save</button></td></tr>`).join('')||'<tr><td colspan="6">No tickets yet.</td></tr>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save));}catch(e){$('#msg').textContent=e.message;}}
async function save(id){const token=$('#token').value.trim();const status=document.querySelector(`[data-ticket="${CSS.escape(id)}"]`).value;$('#msg').textContent='Saving…';try{const r=await fetch('/api/admin/tickets/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({status})});const d=await r.json();if(!r.ok)throw Error(d.error||'Update failed');$('#msg').textContent=`${id} updated to ${status}.`;}catch(e){$('#msg').textContent=e.message;}}
</script></body></html>
